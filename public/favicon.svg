<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#grad)"/>
  <!-- M estilizado com dois picos (como meridiano no mapa) -->
  <polyline
    points="10,48 10,20 24,36 32,22 40,36 54,20 54,48"
    stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"
  />
  <!-- Linha horizontal de referência (meridiano) -->
  <line x1="8" y1="52" x2="56" y2="52" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
</svg>
